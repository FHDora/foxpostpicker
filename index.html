<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Foxpost</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      margin: 0;
    }
    iframe {
      border: none;
      width: 100%;
      height: 650px;
    }
  </style>
</head>
<body>

  <h2>Foxpost csomagautomata vagy átvevőhely kiválasztása</h2>
  <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Kérjük, válassza ki az Önnek megfelelő automatát vagy átvevőhelyet a térképen!</p>

  <iframe src="https://cdn.foxpost.hu/apt-finder/v1/app/"></iframe>

  <script>
    window.addEventListener('message', function (event) {
      if (event.data && event.data.operator === 'foxpost' && event.data.action === 'apt_selected') {
        const point = event.data.apt;
        if (!point || !point.name) {
          alert("Nincs kiválasztott csomagautomata!");
          return;
        }
        const id = String(point.operator_id || "").trim();
        const name = String(point.name || "").trim();
        const address = String(point.address || "").trim();
        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get("returnUrl") || "https://tally.so/r/RGNKA4";
        const tallyUrl = returnUrl
          + "?foxpost_id=" + encodeURIComponent(id)
          + "&foxpost_name=" + encodeURIComponent(name)
          + "&foxpost_address=" + encodeURIComponent(address);
        document.body.innerHTML = "<h2 style='font-family:sans-serif;text-align:center;padding-top:40px;'>Csomagautomata kiválasztva.<br>Visszairányítás...</h2>";
        setTimeout(function () {
          window.location.href = tallyUrl;
        }, 1000);
      }
    });
  </script>

</body>
</html>
