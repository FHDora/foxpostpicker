<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxPost Csomagpont Kereső</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        iframe { border: none; width: 100%; height: 100vh; display: block; }
        .loading-screen { display: none; text-align: center; padding-top: 40px; }
    </style>
</head>
<body>

    <!-- A FoxPost hivatalos widget-e -->
    <iframe id="foxpost-iframe" loading="lazy" src="https://cdn.foxpost.hu/apt-finder/v1/app/"></iframe>

    <!-- Visszairányítási képernyő -->
    <div id="redirect-screen" class="loading-screen">
        <h2>Csomagpont kiválasztva.<br>Visszairányítás a Tally-ra...</h2>
    </div>

    <script>
        // Figyeljük a FoxPost iframe-ből érkező üzeneteket
        window.addEventListener("message", receiveMessage, false);

        function receiveMessage(event) {
            // Biztonsági ellenőrzés
            if (event.origin !== 'https://cdn.foxpost.hu') { return; }

            try {
                // A FoxPost-tól kapott adatok feldolgozása
                const apt = JSON.parse(event.data);
                
                // Csak akkor lépünk tovább, ha valódi pontot választottak ki
                if (apt && apt.name) {
                    
                    // URL paraméterek kiolvasása (pl. returnUrl)
                    const params = new URLSearchParams(window.location.search);
                    const returnUrl = params.get("returnUrl") || "https://tally.so/r/RGNKA4";

                    let cleanId = "";
                    if (apt.operator_id) {
                        cleanId = String(apt.operator_id).trim();
                    } else if (apt.place_id) {
                        cleanId = String(apt.place_id).trim();
                    }
                    
                    // Tally URL összeállítása a FoxPost adataival és az ID-val (apt.findme)
                    const tallyUrl = returnUrl 
                        + "?foxpost_name=" + encodeURIComponent(apt.name)
                        + "&foxpost_address=" + encodeURIComponent(apt.address || "")
                        + "&foxpost_id=" + encodeURIComponent(cleanId);

                    // Felület váltása a visszajelzéshez
                    document.getElementById("foxpost-iframe").style.display = "none";
                    document.getElementById("redirect-screen").style.display = "block";

                    // Visszairányítás 1 másodperc múlva
                    setTimeout(function () {
                        window.location.href = tallyUrl;
                    }, 1000);
                }
            } catch (e) {
                console.error("Hiba az adatok feldolgozásakor:", e);
            }
        }
    </script>
</body>
</html>
